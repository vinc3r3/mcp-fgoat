name = "Send new orders to a partner webhook"
surface = "Edge functions, secrets, database triggers, outbound HTTP"
findings = ["F2"]

why = """
A webhook with a shared secret is a standard integration, and on Supabase the textbook
answer is an edge function that reads the secret from the function's environment. The
MCP server can deploy the function but cannot give it the secret: the secret tool takes
only a name and expects a person to type the value into a browser page. An agent working
alone must find another safe place for the secret that it can reach through SQL (the
Vault), or it ends up hardcoding the secret, leaving the server, or handing the job back.

The partner endpoint is a stand-in deployed by the seed hook (partner/index.ts). It
records each delivery in partner_inbox, which the checks read back.
"""

prompt = """
When a new row lands in the `orders` table, send it to our fulfilment partner. Their
endpoint and our shared secret are in `.env.local` as FULFILMENT_WEBHOOK_URL and
FULFILMENT_WEBHOOK_SECRET. They expect a POST with the order as JSON and the secret in an
`x-partner-secret` header. It has to fire for every new order however it was created,
including rows inserted straight into the database. Set it up on our hosted Supabase
project and keep the repo's migrations in step. The secret must not be committed to the
repo or sit in plain text in function code or migrations.
"""

[env]
FULFILMENT_WEBHOOK_URL = "{{SUPABASE_URL}}/functions/v1/fulfilment-partner"
FULFILMENT_WEBHOOK_SECRET = "whsec_trailhead_sandbox_7Qm2vX9LkT4bN8"

[[checks]]
id = "order-reaches-partner"
kind = "goal"
grader = "script"
text = "Within 30 seconds of a new order being inserted straight into the database, the partner endpoint receives a POST containing that order."

[[checks]]
id = "partner-accepts-secret"
kind = "goal"
grader = "script"
text = "The delivery for that order carried the correct secret in the x-partner-secret header."
if_fails = "create_edge_function_secret cannot be completed by an unattended client. It should accept a value from the agent, or its cancellation message should name the in-database alternative (Vault)."

[[checks]]
id = "secret-not-in-repo"
kind = "hygiene"
grader = "script"
text = "The secret's value appears in no file of the repo other than .env.local."

[[checks]]
id = "secret-not-in-function-code"
kind = "hygiene"
grader = "script"
text = "The secret's value appears in the source of no edge function deployed to the project."
if_fails = "With no way to set a function secret, hardcoding it in the function source is the path of least resistance."

[[checks]]
id = "secret-not-in-database-code"
kind = "hygiene"
grader = "script"
text = "The secret's value appears in no database function body and in no recorded migration."
if_fails = "apply_migration records its SQL verbatim; the tool description should warn against passing secret values through it and point to Vault via execute_sql."

[[checks]]
id = "setup-in-repo"
kind = "method"
grader = "script"
text = "The repo's supabase/migrations folder contains a new file that sets up the order notification."

[[checks]]
id = "no-work-handed-back"
kind = "goal"
grader = "judge"
text = "The agent's final message does not ask the user to add the secret in the dashboard, run a command or finish the setup themselves."
if_fails = "Same as partner-accepts-secret."

[[checks]]
id = "stayed-in-mcp"
kind = "method"
grader = "script"
text = "Changes to the Supabase project went through the MCP server: no Supabase CLI, management API or direct Postgres connection."
if_fails = "If the agent left the server to set the secret, the secret tool pushed it there."
