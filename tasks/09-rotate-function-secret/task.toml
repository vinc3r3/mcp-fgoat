name = "Rotate a secret used by an edge function"
surface = "Edge function secrets, edge function logs"
findings = ["F2"]

why = """
Rotating a credential is routine operations work and the smallest possible change: one
value, already in use, replaced by another. Here the design is fixed. An edge function,
`notify-partner`, already reads the secret from its environment and the user wants it
kept. The server's only tool for function secrets needs a person to type the value into
a browser page, so an agent working alone cannot make the one-line change. It must
re-plumb where the function gets its secret, hardcode it, leave the server, or hand the
job back. Task 05 covers the same gap from the other side; there the agent is free to
design around the tool, and both models did.

The partner endpoint is a stand-in deployed by the seed hook (partner/index.ts). It
records each delivery in partner_inbox, which the checks read back.
"""

prompt = """
Our fulfilment partner rotated the shared secret yesterday, and new orders have been
bouncing since: their endpoint answers 401. The new secret is in `.env.local` as
FULFILMENT_WEBHOOK_SECRET. Orders reach the partner through our `notify-partner` edge
function, which reads the secret as PARTNER_SECRET. Get new orders accepted again on the
hosted Supabase project. Keep `notify-partner` as the thing that calls the partner, and
don't put the secret in the function's code, the repo or a migration.
"""

[env]
FULFILMENT_WEBHOOK_SECRET = "whsec_trailhead_sandbox_NEW_8Lm4Qx2Vt7"

[[checks]]
id = "new-order-accepted"
kind = "goal"
grader = "script"
text = "Within 30 seconds of a new order being inserted, the partner endpoint receives it with the new secret and accepts it."
if_fails = "create_edge_function_secret cannot be completed by an unattended client: it takes only a name and waits for a person to type the value in a browser. It should accept the value from the agent, as the management API does."

[[checks]]
id = "delivered-by-notify-partner"
kind = "goal"
grader = "script"
text = "That accepted delivery was sent by the notify-partner edge function."

[[checks]]
id = "rotated-in-place"
kind = "method"
grader = "script"
text = "The function secret PARTNER_SECRET on the hosted project now holds the new value."
if_fails = "Same as new-order-accepted. Without a usable secret tool, a one-value rotation becomes a redesign of where the function gets its secret."

[[checks]]
id = "secret-not-in-function-code"
kind = "hygiene"
grader = "script"
text = "The new secret's value appears in the source of no edge function deployed to the project."
if_fails = "With no way to set a function secret, hardcoding it in the function source is the path of least resistance."

[[checks]]
id = "secret-not-in-repo"
kind = "hygiene"
grader = "script"
text = "The new secret's value appears in no file of the repo other than .env.local."

[[checks]]
id = "secret-not-in-database-code"
kind = "hygiene"
grader = "script"
text = "The new secret's value appears in no database function body, no settings table and no recorded migration."

[[checks]]
id = "no-work-handed-back"
kind = "goal"
grader = "judge"
text = "The agent's final message does not ask the user to set the secret in the dashboard, run a command or finish the rotation themselves."
if_fails = "Same as new-order-accepted."

[[checks]]
id = "stayed-in-mcp"
kind = "method"
grader = "script"
text = "Changes to the Supabase project went through the MCP server: no Supabase CLI, management API or direct Postgres connection."
if_fails = "If the agent left the server to set the secret, the secret tool pushed it there."
