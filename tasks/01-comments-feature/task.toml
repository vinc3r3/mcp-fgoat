name = "Ship a comments feature end to end"
surface = "Schema changes, row-level security, API grants, migration history"
findings = ["F4", "F5", "F6"]

why = """
The most common thing a coding agent does with Supabase: add a table, secure it, use it
from the app. On current projects a new table is invisible to the app until it is
granted to the API roles, which older tutorials never mention, and a migration applied
through the server leaves no file in the repo. Both gaps are silent: every tool call
succeeds and the feature still does not work or cannot be rebuilt.
"""

prompt = """
Add comments to Trailhead. Under each post on the home page, show its comments with the
author's name, and give signed-in members a box to add one. Members can delete their own
comments but nobody else's; visitors can read but not write. Store them in a new
`comments` table. Ship it to our hosted Supabase project so it works for the test
accounts in the README, and keep the repo's migrations in step with what you ship.
"""

[[checks]]
id = "visitor-can-read-comments"
kind = "goal"
grader = "script"
text = "A visitor who is not signed in can read comments through the project's API."
if_fails = "apply_migration should warn when a new table has policies but no grants for the API roles; today the result is {\"success\":true} and the app gets 'permission denied'."

[[checks]]
id = "member-can-comment"
kind = "goal"
grader = "script"
text = "A signed-in member can add a comment to a post."
if_fails = "Same grant gap as above, for INSERT."

[[checks]]
id = "visitor-cannot-comment"
kind = "goal"
grader = "script"
text = "A visitor who is not signed in cannot add a comment."

[[checks]]
id = "no-impersonation"
kind = "goal"
grader = "script"
text = "A member cannot add a comment that is recorded as written by another member."

[[checks]]
id = "delete-own-only"
kind = "goal"
grader = "script"
text = "A member cannot delete another member's comment, and can delete their own."

[[checks]]
id = "comments-on-home-page"
kind = "goal"
grader = "script"
text = "The built app serves the home page with status 200 and an existing comment's text appears on it."

[[checks]]
id = "migration-recorded"
kind = "method"
grader = "script"
text = "The project's migration history contains a migration that creates the comments table."
if_fails = "execute_sql accepts DDL silently; it should refuse or warn and point to apply_migration."

[[checks]]
id = "migration-in-repo"
kind = "method"
grader = "script"
text = "The repo's supabase/migrations folder contains a new file that creates the comments table."
if_fails = "apply_migration should return the recorded version and the file name to save, e.g. supabase/migrations/<version>_<name>.sql."

[[checks]]
id = "app-builds"
kind = "hygiene"
grader = "script"
text = "`npm run build` succeeds in the agent's working directory."

[[checks]]
id = "stayed-in-mcp"
kind = "method"
grader = "script"
text = "Changes to the Supabase project went through the MCP server: no Supabase CLI, management API or direct Postgres connection."
if_fails = "The server's own instructions tell agents with a shell to use the Supabase CLI; the MCP tools should be sufficient for a remote project, or say when they are not."
